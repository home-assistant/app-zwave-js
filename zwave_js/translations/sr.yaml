---
configuration:
  device:
    name: Уређај
    description: Уређај Z-Wave контролера.
  socket:
    name: Сокет
    description: >-
      Уместо коришћења физичког уређаја, можете се повезати са Z-Wave
      адаптером путем сокета.
  log_level:
    name: Ниво евиденције
    description: Ова опција подешава ниво бележења догађаја за Z-Wave JS.
  log_to_file:
    name: Чување евиденције у датотеци?
    description: >-
      Када је ова опција укључена, записи ће се чувати у фасцикли
      `/addon_configs/core_zwave_js` са екстензијом `.log`.
  log_max_files:
    name: Максималан број датотека евиденције
    description: >-
      Када је опција `log_to_file` укључена, Z-Wave JS креира нову датотеку
      евиденције за сваки дан. Ова опција вам омогућава да одредите максималан
      број датотека које Z-Wave JS чува.
  network_key:
    name: Мрежни кључ
    description: >-
      У претходним верзијама апликације ово је био једини потребан кључ.
      Увођењем S2 безбедносног укључивања у zwave-js, ова опција је
      застарела.
  rf_region:
    name: Радио-фреквенцијски регион
    description: Радио-фреквенцијски регион који контролер треба да користи.
  s0_legacy_key:
    name: Застарели S0 кључ
    description: >-
      Z-Wave уређаји са S0 безбедношћу захтевају мрежни кључ пре додавања у
      мрежу.
  s2_access_control_key:
    name: S2 кључ за контролу приступа
    description: >-
      Овај кључ је неопходан за додавање уређаја са S2 Access Control
      безбедносном класом.
  s2_authenticated_key:
    name: S2 аутентификовани кључ
    description: >-
      Овај кључ је неопходан за додавање уређаја са S2 Authenticated
      безбедносном класом.
  s2_unauthenticated_key:
    name: S2 неаутентификовани кључ
    description: >-
      Овај кључ је неопходан за додавање уређаја са S2 Unauthenticated
      безбедносном класом.
  lr_s2_access_control_key:
    name: Z-Wave Long Range S2 кључ за контролу приступа
    description: >-
      Овај кључ је неопходан за додавање уређаја који користе Z-Wave Long
      Range са S2 Access Control безбедносном класом.
  lr_s2_authenticated_key:
    name: Z-Wave Long Range S2 аутентификовани кључ
    description: >-
      Овај кључ је неопходан за додавање уређаја који користе Z-Wave Long
      Range са S2 Authenticated безбедносном класом.
  soft_reset:
    name: Софт ресетовање контролера серије 500
    description: >-
      Ово подешавање одређује како апликација рукује меким ресетовањем за
      контролере серије 500. Подразумевана опција, Аутоматски, налаже апликацији
      да сама препозна да ли ову функцију треба укључити. Подразумевана вредност
      одговара већини корисника, па је мењајте само ако знате шта радите и/или
      ако вам је то затражено.
  disable_controller_recovery:
    name: Онемогући аутоматски опоравак контролера
    description: >-
      Ово подешавање искључује аутоматски процес опоравка у Z-Wave JS-у када
      контролер престане да реагује и уместо тога препушта контролеру да се сам
      опорави, уколико је за то способан. Док контролер не реагује, команде ће
      почети да отказују, а чворови могу насумично бити означени као недоступни.
      Ако контролер не успе сам да се опорави, мораћете поново да покренете
      апликацију. У већини случајева корисницима ова опција никада неће бити
      потребна, па је мењајте само ако знате шта радите и/или ако вам је то
      затражено.
  disable_watchdog:
    name: Онемогући Z-Wave JS (хардверски) watchdog
    description: >-
      Ово подешавање спречава Z-Wave JS да укључи хардверски watchdog на
      контролерима који га подржавају. У већини случајева корисницима ова
      опција никада неће бити потребна, па је мењајте само ако знате шта
      радите и/или ако вам је то затражено.
  safe_mode:
    name: Омогући безбедни режим
    description: >-
      Ово подешавање пребацује вашу мрежу у безбедни режим, што може значајно
      смањити перформансе ваше мреже, али такође може помоћи да се мрежа
      покрене и проради како бисте могли да решите проблеме, преузмете
      евиденцију (логове) итд. У већини случајева корисницима ова опција никада
      неће бити потребна, па је мењајте само ако знате шта радите и/или ако
      вам је то затражено.
network:
  3000/tcp: Z-Wave JS WebSocket комуникациони порт
  8091/tcp: Z-Wave JS UI веб порт
